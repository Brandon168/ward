name: Release

# Push an annotated tag like v0.3.2 that matches manifest.json; its message becomes the release notes and the
# tested build is published as a GitHub release. Store submission is a separate, manual step: see store.yml.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches manifest version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./manifest.json").version')"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Source archive
        run: git archive --format=zip --prefix="ward-${GITHUB_REF_NAME#v}-source/" -o "dist/ward-${GITHUB_REF_NAME#v}-source.zip" HEAD
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" # checkout drops the tag's annotation
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Ward ${GITHUB_REF_NAME#v}" --notes-from-tag --verify-tag
