name: CI

# Docs-only pushes skip CI: no test or guard reads Markdown or docs/. A push that touches anything else runs it all.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (a tag can be moved; a compromised Action is how the
# April 2026 Bitwarden CLI npm release was poisoned).
# One job: guard rails first (they run while Vaultwarden starts), then the tests and the build. GitHub bills each job
# rounded up to a whole minute, so a separate few-second guard job cost a minute per push.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      vaultwarden:
        image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
        ports: ['8099:80']
        env:
          I_REALLY_WANT_VOLATILE_STORAGE: 'true'
          LOGIN_RATELIMIT_MAX_BURST: '100'
          LOGIN_RATELIMIT_SECONDS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Guard rails (permissions, network call sites, dynamic code, vendor hashes, size budgets)
        run: node scripts/guard.mjs
      - name: Vendored argon2 is byte-identical to hash-wasm 4.12.0 on npm
        run: |
          curl -sSfL -o /tmp/hw.tgz https://registry.npmjs.org/hash-wasm/-/hash-wasm-4.12.0.tgz
          node -e '
            const want = "sha512-+/2B2rYLb48I/evdOIhP+K/DD2ca2fgBjp6O+GBEnCDk2e4rpeXIK8GvIyRPjTezgmWn9gmKwkQjjx6BtqDHVQ==";
            const got = "sha512-" + require("crypto").createHash("sha512").update(require("fs").readFileSync("/tmp/hw.tgz")).digest("base64");
            if (got !== want) { console.error("hash-wasm tarball integrity mismatch", got); process.exit(1); }'
          tar -xzf /tmp/hw.tgz -C /tmp package/dist/argon2.umd.min.js
          cmp /tmp/package/dist/argon2.umd.min.js vendor/argon2.umd.min.js
      - name: Vendored EFF word list matches eff.org
        run: curl -sSfL https://www.eff.org/files/2016/07/18/eff_large_wordlist.txt | cmp - vendor/eff_large_wordlist.txt
      - name: No secrets committed
        run: |
          ! git grep -nI -E '(BEGIN [A-Z ]*PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' -- . ':!scripts/guard.mjs'
      - name: Wait for Vaultwarden
        run: timeout 60 sh -c 'until curl -sf localhost:8099/alive; do sleep 1; done'
      - name: Offline and integration tests
        run: node test.mjs --integration
      - name: Build
        run: ./pack.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*.zip
